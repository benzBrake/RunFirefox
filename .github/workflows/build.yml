name: CI

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test release note generator
        shell: pwsh
        run: .\scripts\test-generate-release-notes.ps1

      - name: Validate changelog files
        shell: pwsh
        run: .\scripts\generate-release-notes.ps1 -ValidateOnly

      - name: Install AutoIt3
        shell: pwsh
        run: '& .\scripts\install-autoit.ps1'

      - name: Test unified download routing
        shell: pwsh
        run: .\scripts\test-download-routing.ps1

      - name: Test Helium downloads
        shell: pwsh
        run: .\scripts\test-helium-download.ps1

      - name: Test Brave downloads
        shell: pwsh
        run: .\scripts\test-brave-download.ps1

      - name: Test network settings
        shell: pwsh
        run: .\scripts\test-network-settings.ps1

      - name: Test Opera downloads
        shell: pwsh
        run: .\scripts\test-opera-download.ps1

      - name: Test Vivaldi downloads
        shell: pwsh
        run: .\scripts\test-vivaldi-download.ps1

      - name: Test Whale downloads
        shell: pwsh
        run: .\scripts\test-whale-download.ps1

      - name: Generate nightly scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Copy-Item -LiteralPath '.\RunFirefox.au3' -Destination '.\RunChrome.au3' -Force

          $source = Get-Content -LiteralPath '.\RunChrome.au3' -Raw
          $source = [regex]::Replace($source, '(?m)^#AutoIt3Wrapper_Icon=.*\r?$', '#AutoIt3Wrapper_Icon=icons\Chrome.ico')
          $source = [regex]::Replace($source, '(?m)^#AutoIt3Wrapper_Outfile=.*\r?$', '#AutoIt3Wrapper_Outfile=RunChrome.exe')
          $source = [regex]::Replace($source, '(?m)^#AutoIt3Wrapper_Outfile_x64=.*\r?$', '#AutoIt3Wrapper_Outfile_x64=RunChrome_x64.exe')
          $source = [regex]::Replace($source, '(?m)^Global Const \$CustomArch = ".*"\r?$', 'Global Const $CustomArch = "RunChrome"')
          Set-Content -LiteralPath '.\RunChrome.au3' -Value $source -Encoding utf8

      - name: Inject Google API keys
        shell: pwsh
        env:
          CHROMIUM_GOOGLE_API_KEY: ${{ secrets.CHROMIUM_GOOGLE_API_KEY }}
          CHROMIUM_GOOGLE_DEFAULT_CLIENT_ID: ${{ secrets.CHROMIUM_GOOGLE_DEFAULT_CLIENT_ID }}
          CHROMIUM_GOOGLE_DEFAULT_CLIENT_SECRET: ${{ secrets.CHROMIUM_GOOGLE_DEFAULT_CLIENT_SECRET }}
        run: >
          .\scripts\inject-chromium-google-api.ps1
          -Paths @('.\RunFirefox.au3', '.\RunChrome.au3')

      - name: Build nightly scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $autoItPath = Join-Path $env:AUTOIT_DIR 'AutoIt3.exe'
          $wrapperPath = Join-Path $env:AUTOIT_DIR 'SciTE\AutoIt3Wrapper\AutoIt3Wrapper.au3'
          $scripts = @(
              (Resolve-Path -LiteralPath '.\RunFirefox.au3').Path
              (Resolve-Path -LiteralPath '.\RunChrome.au3').Path
          )

          $failures = @($scripts | ForEach-Object -Parallel {
              $arguments = "`"$using:wrapperPath`" /in `"$_`" /NoStatus"
              $process = Start-Process -FilePath $using:autoItPath -ArgumentList $arguments -NoNewWindow -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                  $_
              }
          } -ThrottleLimit 2)

          if ($failures.Count -gt 0) {
              $failedScripts = $failures -join ', '
              throw "AutoIt3Wrapper failed for: $failedScripts"
          }

          $expectedOutputs = @(
              '.\RunFirefox.exe'
              '.\RunFirefox_x64.exe'
              '.\RunChrome.exe'
              '.\RunChrome_x64.exe'
          )

          foreach ($output in $expectedOutputs) {
              if (-not (Test-Path -LiteralPath $output)) {
                  throw "$output was not produced."
              }
          }

      - name: Upload RunFirefox nightly artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-artifact@v4
        with:
          name: RunFirefox-nightly-${{ github.run_number }}-${{ github.sha }}
          path: |
            RunFirefox.exe
            RunFirefox_x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload RunChrome nightly artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-artifact@v4
        with:
          name: RunChrome-nightly-${{ github.run_number }}-${{ github.sha }}
          path: |
            RunChrome.exe
            RunChrome_x64.exe
          if-no-files-found: error
          retention-days: 14

  release:
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write

    steps:
      - name: Debug Info
        shell: pwsh
        run: |
          "github.ref: $env:GITHUB_REF"
          "github.event_name: $env:GITHUB_EVENT_NAME"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install AutoIt3
        shell: pwsh
        run: '& .\scripts\install-autoit.ps1'

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tag must match vX.Y.Z. Actual tag: $tag"
          }

          $version = $Matches.version
          $source = Get-Content -LiteralPath '.\RunFirefox.au3' -Raw
          $escapedVersion = [regex]::Escape($version)
          $fileVersionPattern = '(?m)^#AutoIt3Wrapper_Res_Fileversion={0}\.0\r?$' -f $escapedVersion
          $appVersionPattern = '(?m)^Global Const \$AppVersion = "{0}"\r?$' -f $escapedVersion

          if ($source -notmatch $fileVersionPattern) {
              throw "RunFirefox.au3 file version does not match $tag."
          }

          if ($source -notmatch $appVersionPattern) {
              throw "RunFirefox.au3 app version does not match $tag."
          }

          "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Generate scripts for all icons
        shell: bash
        run: |
          for icon in icons/*.ico; do
            basename=$(basename "$icon" .ico)
            # Exclude the base Firefox icon.
            if [ "$basename" != "Firefox" ]; then
              cp RunFirefox.au3 "Run${basename}.au3"
              sed -i "s/Firefox.ico/${basename}.ico/" "Run${basename}.au3"
              sed -i "s/Global Const \$CustomArch.*/Global Const \$CustomArch = \"Run${basename}\"/" "Run${basename}.au3"
              sed -i "s/RunFirefox.exe/Run${basename}.exe/" "Run${basename}.au3"
              sed -i "s/RunFirefox_x64.exe/Run${basename}_x64.exe/" "Run${basename}.au3"
            fi
          done

      - name: Inject Google API keys
        shell: pwsh
        env:
          CHROMIUM_GOOGLE_API_KEY: ${{ secrets.CHROMIUM_GOOGLE_API_KEY }}
          CHROMIUM_GOOGLE_DEFAULT_CLIENT_ID: ${{ secrets.CHROMIUM_GOOGLE_DEFAULT_CLIENT_ID }}
          CHROMIUM_GOOGLE_DEFAULT_CLIENT_SECRET: ${{ secrets.CHROMIUM_GOOGLE_DEFAULT_CLIENT_SECRET }}
        run: >
          .\scripts\inject-chromium-google-api.ps1
          -Paths @(Get-ChildItem -Filter 'Run*.au3' | ForEach-Object { $_.FullName })

      - name: Build scripts in parallel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $autoItPath = Join-Path $env:AUTOIT_DIR 'AutoIt3.exe'
          $wrapperPath = Join-Path $env:AUTOIT_DIR 'SciTE\AutoIt3Wrapper\AutoIt3Wrapper.au3'
          $scripts = @(Get-ChildItem -Filter 'Run*.au3')

          if ($scripts.Count -eq 0) {
              throw 'No Run*.au3 scripts were found.'
          }

          $failures = @($scripts | ForEach-Object -Parallel {
              $arguments = "`"$using:wrapperPath`" /in `"$($_.FullName)`" /NoStatus"
              $process = Start-Process -FilePath $using:autoItPath -ArgumentList $arguments -NoNewWindow -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                  $_.Name
              }
          } -ThrottleLimit 4)

          if ($failures.Count -gt 0) {
              $failedScripts = $failures -join ', '
              throw "AutoIt3Wrapper failed for: $failedScripts"
          }

      - name: Check the output
        shell: pwsh
        run: Get-ChildItem -Force

      - name: Package the binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = '${{ steps.version.outputs.VERSION }}'
          $exes = @(Get-ChildItem -Filter 'Run*.exe')

          if ($exes.Count -eq 0) {
              throw 'No Run*.exe files were produced.'
          }

          foreach ($exe in $exes) {
              if ($exe.BaseName.EndsWith('_x64', [StringComparison]::Ordinal)) {
                  $baseName = $exe.BaseName.Substring(0, $exe.BaseName.Length - 4)
                  $arch = '_x64'
              } else {
                  $baseName = $exe.BaseName
                  $arch = ''
              }

              $zipName = "$baseName`_$version$arch.zip"
              & 7z a -tzip $zipName $exe.FullName

              if ($LASTEXITCODE -ne 0) {
                  throw "7z failed while packaging $($exe.Name)."
              }
          }

      - name: Create changelog text
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\generate-release-notes.ps1 -Tag '${{ github.ref_name }}'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to generate release notes.' }


      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = '${{ github.ref_name }}'
          $assets = @(Get-ChildItem -Filter '*.zip' | ForEach-Object { $_.FullName })

          if ($assets.Count -eq 0) {
              throw 'No zip assets were found.'
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
              gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $tag --notes-file '.\release-notes.md'
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to update release $tag."
              }

              foreach ($asset in $assets) {
                  gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber
                  if ($LASTEXITCODE -ne 0) {
                      throw "Failed to upload release asset: $asset"
                  }
              }
          } else {
              $createArgs = @(
                  'release',
                  'create',
                  $tag
              ) + $assets + @(
                  '--repo',
                  $env:GITHUB_REPOSITORY,
                  '--title',
                  $tag,
                  '--notes-file',
                  '.\release-notes.md',
                  '--verify-tag'
              )

              gh @createArgs
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to create release $tag."
              }
          }
