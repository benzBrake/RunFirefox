; RunFirefox 自定义语言文件 / RunFirefox custom language file
;
; 用法：把本文件放到 RunFirefox.exe 同目录即可生效（无需重新编译）。
; Usage: place this file next to RunFirefox.exe (no recompilation required).
;
; 合并规则 / Merge rules:
;   - 按 key 合并，不是整体替换：同名 key 会覆盖内置文案，其余内置文案保持不变。
;   - 新增一个语言 section（例如 [es-ES]）即可在设置界面的语言下拉框中出现新语言。
;   - 新语言 section 至少需要 LangTitle；LangSupportAuthor / LangSupportUrl 为可选项。
;   - 语言代码建议使用 Firefox 可识别的格式，例如 en-US、zh-CN、es-ES。
;   - 修改后切换语言需要重启 RunFirefox 才能生效。
;
; This template ships a complete Spanish (es-ES) example section.

